name: Craft libs adoption scan

on:
  schedule:
    # Four 6h windows; the 00:20 slot lands right after the suite's
    # 22:00-00:00 UTC merge burst so the first scan sees the day's work.
    - cron: "20 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model id for this run (scheduled runs keep the MODEL_ID secret)"
        required: false
        default: github-actions
      workflow:
        description: "Which run: the judged adopt-libs workflow (the default), or the mission (the rollback path)"
        required: false
        default: adopt-libs
        type: choice
        options:
          - mission
          - adopt-libs
      gateway-tag:
        description: "IronRouter release tag to run the gateway from (empty = latest published release)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Scheduled scans serialize on one group (a cron slot never overlaps the
  # previous window); every manual dispatch joins its own group, so
  # concurrent manual runs — a mission scan next to a workflow rehearsal —
  # never block each other.
  group: adopt-libs-${{ github.event_name == 'schedule' && 'scheduled' || github.run_id }}
  cancel-in-progress: false

env:
  TARGET_REPO: ahmedhosnypro/craft-libs
  # Subagent pool knobs. The concurrency cap is a deliberate bound, not
  # a ceiling to chase: each child is a full runner with its own context
  # and provider stream, and the job's runner has 7 GB, so 688 PRs at
  # once would thrash. A saturated pool queues detached spawns rather
  # than refusing them, and a dispatch from a running pipeline — a
  # continuation — launches ahead of fresh dispatches, so every PR's
  # next stage runs the moment a slot frees. Total covers the window's
  # pipelines plus each pipeline's stage children plus retries. Depth 3
  # lets a filer fan its per-consumer duplication proofs out as parallel
  # dup-verifier children; dup-verifiers spawn nothing (no depth 4).
  CRAFT_AGENT_SUBAGENT_MAX_CONCURRENCY: "48"
  CRAFT_AGENT_SUBAGENT_MAX_TOTAL: "1024"
  CRAFT_AGENT_SUBAGENT_MAX_DEPTH: "3"
  # One model call may stream past 5 minutes (thinking models); the
  # client deadline must exceed real generation time.
  CRAFT_AGENT_REQUEST_TIMEOUT_SECS: "900"
  # The model gateway comes from the published IronRouter release
  # (ahmedhosnypro/IronRouter), not a source checkout: one asset pair —
  # the gateway binary (dashboard embedded) and the migration binary —
  # plus checksums. The registry dump still ships in the backend source
  # repo and is fetched by itself. A dispatch may pin a release tag; the
  # default resolves the latest published release.
  MODEL_GATEWAY_RELEASE_REPO: ahmedhosnypro/IronRouter
  MODEL_GATEWAY_SOURCE_REPO: ahmedhosnypro/ironrouter-backend
  MODEL_GATEWAY_DUMP: ironrouter-registry.dump
  MODEL_GATEWAY_BIN: ironrouter-x86_64-unknown-linux-gnu
  MODEL_GATEWAY_MIGRATION_BIN: ironrouter-migration-x86_64-unknown-linux-gnu
  MODEL_GATEWAY_PORT: "17844"
  # Model the gateway must serve; a manual run may override it.
  EXPECTED_MODEL: ${{ github.event.inputs.model || 'github-actions' }}
  CRAFT_AGENT_EGRESS_ALLOWLIST: github.com,api.github.com,codeload.github.com,objects.githubusercontent.com

jobs:
  scan:
    runs-on: ubuntu-latest
    # 6h — the maximum job wall-clock on free public-repo runners.
    timeout-minutes: 360
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the model gateway release (token never in a URL, config, or log line)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          GATEWAY_TAG: ${{ inputs.gateway-tag }}
        run: |
          set -euo pipefail
          umask 077
          # gh reads the token from the environment — it never lands in an
          # argv, URL, or log line. An empty GATEWAY_TAG resolves the
          # latest published release.
          tag="$GATEWAY_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view -R "$MODEL_GATEWAY_RELEASE_REPO" --json tagName --jq .tagName)"
          fi
          test -n "$tag" || { echo "::error::no release tag resolved for $MODEL_GATEWAY_RELEASE_REPO"; exit 1; }
          mkdir -p "$RUNNER_TEMP/gateway"
          gh release download "$tag" -R "$MODEL_GATEWAY_RELEASE_REPO" \
            --pattern "$MODEL_GATEWAY_BIN" \
            --pattern "$MODEL_GATEWAY_MIGRATION_BIN" \
            --pattern checksums.txt \
            --dir "$RUNNER_TEMP/gateway"
          chmod +x "$RUNNER_TEMP/gateway/$MODEL_GATEWAY_BIN" \
                   "$RUNNER_TEMP/gateway/$MODEL_GATEWAY_MIGRATION_BIN"
          (cd "$RUNNER_TEMP/gateway" && sha256sum --check checksums.txt)
          echo "gateway release $tag: binary + migration binary, checksums verified"

      - name: Fetch the registry dump from the backend source repo
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          # The registry dump ships in the backend source repo (not as a
          # release asset); fetch the single file by its raw content type.
          gh api "repos/${MODEL_GATEWAY_SOURCE_REPO}/contents/${MODEL_GATEWAY_DUMP}" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/gateway/${MODEL_GATEWAY_DUMP}"
          test -s "$RUNNER_TEMP/gateway/${MODEL_GATEWAY_DUMP}" \
            || { echo "::error::the registry dump fetch returned an empty file"; exit 1; }

      - name: Start the gateway database
        env:
          GATEWAY_DB_PASSWORD: ${{ secrets.GATEWAY_DB_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          docker run -d --name model_gateway_postgres --network host \
            -e POSTGRES_USER=ironrouter \
            -e POSTGRES_PASSWORD="$GATEWAY_DB_PASSWORD" \
            -e POSTGRES_DB=ironrouter_live \
            -v model_gateway_pgdata:/var/lib/postgresql/data \
            postgres:17 -p 5434
          ready=0
          for _ in $(seq 1 30); do
            if docker exec model_gateway_postgres pg_isready -p 5434 -U ironrouter >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::postgres never became ready on :5434"
            exit 1
          fi

      - name: Restore the model registry
        run: |
          set -euo pipefail
          docker exec -i model_gateway_postgres pg_restore -p 5434 -U ironrouter \
            -d ironrouter_live --clean --if-exists \
            < "${RUNNER_TEMP}/gateway/${MODEL_GATEWAY_DUMP}"

      - name: Apply pending gateway migrations
        working-directory: ${{ runner.temp }}/gateway
        env:
          GATEWAY_DB_PASSWORD: ${{ secrets.GATEWAY_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # The gateway binary does not migrate on boot; a binary newer
          # than the dump needs its pending migrations applied first. The
          # migration binary ships beside the gateway in the release.
          export DATABASE_URL="postgres://ironrouter:${GATEWAY_DB_PASSWORD}@127.0.0.1:5434/ironrouter_live"
          "./${MODEL_GATEWAY_MIGRATION_BIN}" up

      - name: Start the model gateway
        env:
          IR_MASTER_KEY: ${{ secrets.IR_MASTER_KEY }}
          GATEWAY_DB_PASSWORD: ${{ secrets.GATEWAY_DB_PASSWORD }}
        working-directory: ${{ runner.temp }}/gateway
        run: |
          set -euo pipefail
          umask 077
          export DATABASE_URL="postgres://ironrouter:${GATEWAY_DB_PASSWORD}@127.0.0.1:5434/ironrouter_live"
          export HOST=127.0.0.1
          export PORT="${MODEL_GATEWAY_PORT}"
          export BACKEND_URL="http://localhost:${MODEL_GATEWAY_PORT}"
          export RUST_ENV=development
          export COOKIE_SECURE=false
          export RUST_LOG=info
          # Full-body budget for one upstream generation — must sit at
          # or above the client's CRAFT_AGENT_REQUEST_TIMEOUT_SECS.
          export UPSTREAM_TIMEOUT_MS=900000
          export IR_MASTER_KEY
          nohup "./${MODEL_GATEWAY_BIN}" > "${RUNNER_TEMP}/gateway.log" 2>&1 &

      - name: Wait for the gateway (healthz, then authed model listing)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          set -euo pipefail
          live=0
          for _ in $(seq 1 36); do
            if curl -fsS --max-time 2 "http://localhost:${MODEL_GATEWAY_PORT}/healthz" >/dev/null 2>&1; then
              live=1
              break
            fi
            sleep 5
          done
          if [ "$live" -ne 1 ]; then
            echo "::error::gateway /healthz never answered on :${MODEL_GATEWAY_PORT}"
            tail -n 20 "${RUNNER_TEMP}/gateway.log" || true
            exit 1
          fi
          ready=0
          for _ in $(seq 1 12); do
            if curl -fsS -H "Authorization: Bearer ${MODEL_API_KEY}" \
              "http://localhost:${MODEL_GATEWAY_PORT}/v1/models" 2>/dev/null \
              | grep -q "${EXPECTED_MODEL}"; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::/v1/models never listed ${EXPECTED_MODEL} (API key or master key mismatch)"
            exit 1
          fi

      - name: Load the mission prompt
        id: mission
        if: ${{ github.event.inputs.workflow != 'adopt-libs' && github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          {
            echo "text<<MISSION_EOF"
            cat missions/adopt-libs.md
            echo "MISSION_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run the adoption scan (live stream)
        id: agent
        env:
          CRAFT_AGENT_PROVIDER: openai
          CRAFT_AGENT_MODEL: ${{ github.event.inputs.model || secrets.MODEL_ID }}
          # Mission-only knobs below — read by run-scan.sh in mission mode
          # alone, so they may be left in place in workflow mode.
          CRAFT_AGENT_ARGS: --agent lib-adoption-analyst
          CRAFT_AGENT_MAX_TURNS: "250"
          CRAFT_AGENT_MAX_TOKENS: "5000000000"
          # The dispatch dropdown selects the judged workflow; scheduled
          # runs always take it, and anything else keeps the mission.
          # run-scan.sh switches on this.
          CRAFT_AGENT_WORKFLOW: ${{ (github.event.inputs.workflow == 'adopt-libs' || github.event_name == 'schedule') && 'adopt-libs' || '' }}
          # Ride out transient gateway drops mid-run.
          CRAFT_AGENT_STEP_RETRIES: "6"
          # Transient failures keep retrying for this long, past the
          # attempt bound, before a step gives up.
          CRAFT_AGENT_RETRY_PATIENCE_SECS: "1800"
          CRAFT_AGENT_WRITE_REPO: ${{ env.TARGET_REPO }}
          CRAFT_AGENT_EGRESS_ALLOWLIST: ${{ env.CRAFT_AGENT_EGRESS_ALLOWLIST }}
          # The mission step is skipped in workflow mode, so this is empty
          # there; run-scan.sh reads it only in mission mode.
          CRAFT_AGENT_PROMPT: ${{ steps.mission.outputs.text }}
          OPENAI_BASE_URL: ${{ secrets.MODEL_API_URL }}
          OPENAI_API_KEY: ${{ secrets.MODEL_API_KEY }}
          # The builtin token cannot write another repository; the run needs
          # push + pull-request rights on the target fork, so it rides the
          # private-access PAT. The write gate pins it to the target repo.
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
        run: bash scripts/run-scan.sh

      - name: Upload the run transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-transcript
          path: |
            ${{ runner.temp }}/craft-agent-stream.jsonl
            .craft-agent/workflows/*/journal.jsonl
            .craft-agent/workflows/*/sessions/*.jsonl
            .craft-agent/workflows/*/sessions/*-seat*.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Keep the schedule alive (60-day activity pulse)
        if: always()
        env:
          # The builtin token cannot push cross-repo; the PAT can.
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Best-effort by design: this push only resets the 60-day
          # schedule timer. The scan runs in this workspace and leaves its
          # scratch tree behind, so the pulse commits into a fresh clone of
          # origin/main — never a rebase of the dirty runner tree — and a
          # pulse that cannot land warns and lets the next run retry; it
          # must never turn a green scan red.
          auth="Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)"
          tree="${RUNNER_TEMP}/pulse-tree"
          for _ in 1 2 3; do
            rm -rf "$tree"
            if git -c "http.https://github.com/.extraheader=${auth}" \
                clone --quiet --depth 1 --branch main \
                "https://github.com/${GITHUB_REPOSITORY}.git" "$tree" \
              && printf '%s conclusion=%s\n' "$(date -u +%FT%TZ)" \
                  "${{ steps.agent.outputs.conclusion || 'unset' }}" >> "$tree/.scan-log" \
              && git -C "$tree" add .scan-log \
              && git -C "$tree" -c user.name=craft-agent \
                  -c user.email=agent@craft-libs-adoption.invalid \
                  commit -m "chore: scan pulse" \
              && git -C "$tree" -c "http.https://github.com/.extraheader=${auth}" \
                  push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::scan pulse could not push; the next run retries"
